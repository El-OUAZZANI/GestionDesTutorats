{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Page introuvable</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .error-card {
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            max-width: 520px;
        }

        h1 {
            font-size: 90px;
            color: #2563eb;
            margin: 0;
        }

        h2 {
            color: #1f2937;
            margin-top: 10px;
        }

        p {
            color: #6b7280;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="error-card">
    <h1>404</h1>
    <h2>Page introuvable ou inaccessible</h2>
    <p>La page demandée n’existe pas ou vous n’avez pas l’autorisation d’y accéder.</p>

    <a href="{% url 'home' %}">Retour à l’accueil</a>
</div>

</body>
</html>
